name = "nonamehub-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[durable_objects.bindings]]
name = "KEY_OBJECT"
class_name = "KeyObject"

[[durable_objects.bindings]]
name = "ACCESS_TOKEN"
class_name = "AccessTokenObject"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeyObject", "AccessTokenObject", "RateLimiter"]