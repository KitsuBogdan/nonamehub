name = "nonamehub"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[kv_namespaces]]
binding = "RESOURCES_KV"
id = "e0b3a45c59044a36bcf2d33cf91b3ba9"

[[r2_buckets]]
binding = "RESOURCES_R2"
bucket_name = "nonamehub-covers"

[vars]
NONAME_WORKER_URL = "https://api.nonamehub.fyi"
NEXT_PUBLIC_SITE_URL = "https://nonamehub.fyi"

routes = [
  { pattern = "nonamehub.fyi", custom_domain = true },
  { pattern = "www.nonamehub.fyi", custom_domain = true },
]
